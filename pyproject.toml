[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "Nekron"
version = "0.0.1"
description = "Nekron"
readme = "README.md"
requires-python = ">=3.13,<3.14"
authors = [{ name = "Linus Lindemann" }]

dependencies = [
    "numpy>=2.0.0",
    "pandas>=2.2.0",
    "hydra-core>=1.3",
    "omegaconf>=2.3",
    "matplotlib>=3.8.0",
    "scikit-learn>=1.8",
    "scipy>=1.12.0",
    "torch>=2.2.0",
    "mlflow>=3.0",
    "python-dotenv>=1.0.0",
    "exchange-calendars>=4.0",
    "statsmodels>=0.14.0",
    "linearmodels>=6.0",
    "pyarrow>=15.0",
]

[project.optional-dependencies]
dev = [
    "pandas-stubs>=2.2.0",
    "ruff>=0.4.0",
    "mypy>=1.10.0",
    "pre-commit>=3.5.0",
    "build>=1.2.0",
    "pytest>=8.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/nekron"]

[tool.ruff]
line-length = 100
target-version = "py313"
src = ["src", "tests"]
# Markdown holds prose, not code: the READMEs align trailing comments into columns
# and elide bodies, neither of which survives the formatter.
extend-exclude = ["*.md"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.mypy]
python_version = "3.13"
strict = true

[[tool.mypy.overrides]]
module = ["mlflow.*"]
ignore_missing_imports = true
follow_imports = "skip"

[[tool.mypy.overrides]]
# pyarrow ships no py.typed marker, and the annotations it does carry are
# incomplete, so strict mode reports no-untyped-call/no-any-return on correct code.
module = ["pyarrow.*"]
ignore_missing_imports = true
follow_imports = "skip"

[[tool.mypy.overrides]]
module = ["exchange_calendars.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["linearmodels.*", "statsmodels.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["scipy.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["sklearn.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["hydra.*"]
ignore_missing_imports = true
